<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#100d0a;--panel:#251c14;--gold:#d7b46a;--text:#f1e2c4;--muted:#b8aa92;--line:#6a5034}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#332318,#100d0a 58%);color:var(--text);font-family:Georgia,serif}
header{padding:24px;border-bottom:1px solid var(--line)} h1{margin:0;color:var(--gold)} header p{color:var(--muted)}
main{display:grid;grid-template-columns:430px 1fr;gap:18px;padding:18px} .panel{background:linear-gradient(#302319,#211912);border:1px solid var(--line);border-radius:8px;padding:16px}
label{display:block;margin:10px 0 5px} input,textarea,button{width:100%;padding:10px;border:1px solid var(--line);border-radius:5px;background:#0d0b09;color:var(--text);font:inherit}
textarea{min-height:76vh;font:13px/1.4 Consolas,monospace;white-space:pre;resize:vertical}
.slider{display:grid;grid-template-columns:100px 1fr 45px;gap:8px;align-items:center} .slider label{margin:7px 0} .value{color:var(--gold);text-align:right}
input[type=range]{padding:0;accent-color:var(--gold)} .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
button{cursor:pointer;font-weight:bold;background:linear-gradient(#9a7240,#654722)} button.alt{background:linear-gradient(#4b3a2a,#2c231b)}
.stats{margin-top:14px;padding:11px;background:#15110d;border:1px solid var(--line);color:var(--muted);line-height:1.5} strong{color:var(--gold)}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>Realistic Hellenistic–Ionian–Sogdian–Persian Namelist</h1><p>Curated names only, strict uniqueness, no House_of surnames.</p></header>
<main>
<section class="panel">
<h2>Export Settings</h2>
<label>Editable faction line</label>
<input id="faction" value="faction: hellenistic_east, ionia, sogdia, persia">
<label>Seed</label><input id="seed" value="323BC-EASTERN-KINGDOMS">
<h2 style="margin-top:18px">Culture weights</h2>
<div class="slider"><label>Greek</label><input class="w" data-k="greek" type="range" min="0" max="100" value="24"><span class="value">24</span></div>
<div class="slider"><label>Ionian</label><input class="w" data-k="ionian" type="range" min="0" max="100" value="20"><span class="value">20</span></div>
<div class="slider"><label>Hellenistic</label><input class="w" data-k="hellenistic" type="range" min="0" max="100" value="21"><span class="value">21</span></div>
<div class="slider"><label>Sogdian</label><input class="w" data-k="sogdian" type="range" min="0" max="100" value="17"><span class="value">17</span></div>
<div class="slider"><label>Persian</label><input class="w" data-k="persian" type="range" min="0" max="100" value="18"><span class="value">18</span></div>
<div class="grid">
<button id="generate">Generate</button><button class="alt" id="randomSeed">Random Seed</button>
<button class="alt" id="copy">Copy</button><button id="download">Download TXT</button>
</div>
<div class="stats" id="stats"><strong>Output:</strong> 200 characters, 140 surnames, 200 women.</div>
</section>
<section class="panel"><h2>Output</h2><textarea id="output" spellcheck="false"></textarea></section>

function seeded(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function shuffle(a,r){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function section(t,a){return "\n\t"+t+"\n\n"+a.map(x=>"\t\t"+x).join("\n")+"\n"}

}
function weightedOrder(arr,w,r,kind){

}
function takeUnique(arr,count){const seen=new Set(),o=[];for(const n of arr){const k=n.toLowerCase();if(!seen.has(k)&&!n.startsWith("House_of_")){seen.add(k);o.push(n)}if(o.length===count)break}if(o.length<count)throw new Error("Not enough unique entries");return o}
